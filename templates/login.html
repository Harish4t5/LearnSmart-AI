
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | LearnSmart AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2457d6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #2457d6;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #2457d6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1743b5;
        }

        .message {
            background: #fff3cd;
            color: #765b00;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        a {
            color: #2457d6;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>LearnSmart AI</h1>
        <p class="subtitle">Welcome back! Please log in.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label>Email Address</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your registered email"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <button type="submit">Login</button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>

    </div>

</body>
</html>
