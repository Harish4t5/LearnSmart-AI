
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | LearnSmart AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2457d6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #2457d6;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #2457d6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1743b5;
        }

        .message {
            background: #fff3cd;
            color: #765b00;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: #2457d6;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>LearnSmart AI</h1>
        <p class="subtitle">Create your student account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <label>Full Name</label>
            <input type="text" name="full_name"
                   placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create a password" minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm your password" required>

            <label>College Name</label>
            <input type="text" name="college_name"
                   placeholder="Enter your college name" required>

            <label>Engineering Branch</label>
            <select name="branch" required>
                <option value="">Select your branch</option>
                <option value="CSE">Computer Science Engineering</option>
                <option value="CSE AI/ML">CSE (AI & ML)</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics & Communication</option>
                <option value="EE">Electrical Engineering</option>
                <option value="ME">Mechanical Engineering</option>
                <option value="CE">Civil Engineering</option>
                <option value="Other">Other</option>
            </select>

            <label>Current Semester</label>
            <select name="semester" required>
                <option value="">Select semester</option>
                {% for number in range(1, 9) %}
                    <option value="{{ number }}">
                        Semester {{ number }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Create Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="#">Login</a>
        </p>

    </div>

</body>
</html>
